[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "retryheader"
version = "1.0.0"
description = "Parse and build HTTP Retry-After, HTTP-date, RateLimit and RateLimit-Policy headers, zero dependencies and typed"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Javier Lianes", email = "javier@lianes8studio.com" }]
keywords = ["http", "retry-after", "ratelimit", "ratelimit-policy", "rate-limit", "http-date", "headers", "backoff", "429", "rfc9110", "rfc9651", "structured-fields"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = ["ruff", "mypy", "pytest", "pytest-timeout", "build", "twine"]

[project.urls]
Homepage = "https://lianes8studio.com"
Source = "https://github.com/JaviLianes8/retryheader"
Issues = "https://github.com/JaviLianes8/retryheader/issues"
Changelog = "https://github.com/JaviLianes8/retryheader/blob/main/CHANGELOG.md"
LinkedIn = "https://www.linkedin.com/in/jlianes/"
Funding = "https://buymeacoffee.com/jlianesglrs"

[tool.hatch.build.targets.sdist]
# Third-party test files are fetched locally and never shipped; only their manifest is.
include = [
    "src",
    "tests",
    "scripts/fetch_upstream.py",
    "README.md",
    "GUIDE.md",
    "CHANGELOG.md",
    "CONTRIBUTING.md",
    "LICENSE",
    "pyproject.toml",
    "requirements-dev.txt",
]
exclude = ["**/__pycache__", "tests/upstream/*", "!tests/upstream/MANIFEST.json"]

[tool.hatch.build.targets.wheel]
packages = ["src/retryheader"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
timeout = 300
